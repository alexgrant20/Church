<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f172a" />
		<title>Offline · ChurchApp</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 16px;
				font-family: system-ui, sans-serif;
				background: #f8fafc;
				color: #0f172a;
				text-align: center;
			}
			button {
				margin-top: 16px;
				padding: 8px 16px;
				border: 0;
				border-radius: 6px;
				background: #0f172a;
				color: #fff;
				font: inherit;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You are offline</h1>
			<p>Check your internet connection, then try again.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
